<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    form { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 1rem 0; }
    input, button { padding: 0.6rem; font-size: 1rem; }
    button { cursor: pointer; }
    #result { border: 1px solid #d0d7de; border-radius: 8px; padding: 1rem; margin-top: 1rem; }
    .quick { margin-top: 1rem; }
    .quick button { margin-right: 0.5rem; }
  </style>
</head>
<body>
  <h1>Weather App</h1>
  <p>Current weather from the free Open-Meteo API. No API key needed.</p>
  <form id="search-form">
    <input id="city-input" type="text" placeholder="Enter a city, e.g. New Delhi" required>
    <button type="submit">Search</button>
    <label><input type="checkbox" id="fahrenheit"> Show in Fahrenheit</label>
  </form>
  <div class="quick">
    <span>Try: </span>
    <button type="button" data-city="New Delhi">New Delhi</button>
    <button type="button" data-city="London">London</button>
    <button type="button" data-city="New York">New York</button>
  </div>
  <div id="result"><p>Search for a city to see its current weather.</p></div>
  <script src="app.js"></script>
</body>
</html>
